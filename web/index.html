<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opencode-pixel</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='2'%20fill='%230a0c13'/%3E%3Crect%20x='2'%20y='3'%20width='12'%20height='8'%20fill='%23151c27'%20stroke='%23ffc857'/%3E%3Crect%20x='4'%20y='5'%20width='5'%20height='1'%20fill='%237fd18b'/%3E%3Crect%20x='4'%20y='7'%20width='7'%20height='1'%20fill='%235aa9e6'/%3E%3Crect%20x='6'%20y='11'%20width='4'%20height='2'%20fill='%233a4354'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="hud">
      <div class="brand">
        <span class="mark" aria-hidden="true">▚</span>
        <span>opencode<span class="slash">/</span>pixel</span>
      </div>
      <div class="stats" id="stats"></div>
      <div class="status">
        <button class="toggle" id="toggle-names" type="button" aria-pressed="false">names</button>
        <span class="conn" id="conn"><i></i> connecting</span>
      </div>
    </header>

    <main>
      <div class="frame">
        <div class="scene">
          <canvas id="office" aria-label="Pixel-art office with the active OpenCode sessions"></canvas>
          <div class="hits" id="hits"></div>
          <div class="labels" id="labels"></div>
        </div>
        <div class="empty hidden" id="empty">
          <b>Quiet office</b>
          <span>Start an agent in any project and it will sit down here.</span>
        </div>
      </div>
      <div class="legend">
        <span><i class="dot idle"></i>idle</span>
        <span><i class="dot thinking"></i>thinking</span>
        <span><i class="dot tool"></i>working</span>
        <span><i class="dot waiting"></i>needs you</span>
        <span><i class="dot done"></i>done</span>
        <span><i class="dot error"></i>error</span>
        <span class="hint" id="hint"></span>
      </div>
      <div class="roster" id="roster" aria-label="Active sessions"></div>
    </main>

    <div class="agent-card" id="agent-card" hidden>
      <div class="card-head">
        <span class="card-dot" id="card-dot"></span>
        <span class="card-status" id="card-status"></span>
        <span class="card-project" id="card-project"></span>
      </div>
      <div class="card-title" id="card-title"></div>
      <div class="card-meta" id="card-meta"></div>
      <div class="card-now" id="card-now"></div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
